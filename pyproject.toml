# configuration for linters and project
[project]
name = "serverless-app-twitter"
dependencies = [
    "boto3",
    "chalice",
    # "chalice[cdkv2]",
    "pytest",
    "requests",
    "python-twitter-v2",
    "awscli",
    "httpie",
    "pyproject-toml",
    "mypy",
    "black",
    "ruff",
    "types-boto3",
    "types-requests"
]
version = "0.1"

[tool.mypy]
[[tool.mypy.overrides]]
module = ["python-twitter-v2", "pytwitter.Api"]
ignore_missing_imports = true
