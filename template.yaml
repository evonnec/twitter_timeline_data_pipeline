AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Serverless pipeline: a scheduled Lambda pulls an X (Twitter) user's timeline and
  queues one SQS message per Tweet; a second Lambda stores Tweet metadata in DynamoDB
  and media in S3. Media that still can't be stored on a message's last receive is
  recorded as retrying and handled by a third Lambda through its own retry queue. A
  fourth, scheduled Lambda tombstones Tweets that were deleted or made unavailable at
  the source and removes their content and S3 objects after a grace period.

Parameters:
  TwitterUsername:
    Type: String
    Default: NASA
    Description: X account whose timeline is fetched.
  ScheduleExpression:
    Type: String
    Default: rate(1 hour)
    Description: EventBridge schedule expression for the fetch run.
  ScheduleEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false to pause the schedule.
  MaxPages:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Maximum timeline pages per fetch run.
  UserIdTtlHours:
    Type: Number
    Default: 24
    MinValue: 0
    MaxValue: 8760
    Description: Hours a resolved user ID is reused before the handle is looked up again (0 looks it up on every run).
  MaxResults:
    Type: Number
    Default: 100
    MinValue: 5
    MaxValue: 100
    Description: Tweets per API page.
  ExpandReferencedTweets:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Also request the posts each Tweet retweets, quotes or replies to, with their
      authors, so the stored item holds the original's full text. Under pay-per-use
      these expanded posts may be billed as reads.
  RequestEntities:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Also request entities (expanded URLs, mentions, hashtags) and the in_reply_to_user_id,
      possibly_sensitive, edit_controls and withheld fields.
  MaxMediaBytes:
    Type: Number
    Default: 536870912  # 512 MiB
    MinValue: 1
    Description: Largest media file stored; bigger ones are recorded as too_large.
  MaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000
    Description: >-
      Receives before a message moves to the dead-letter queue. On the last one the
      Tweet is written even if its media keeps failing: that media is recorded as
      retrying and queued for the media-retry function. A record that fails some other
      way on its last receive still moves to the dead-letter queue.
  MediaRetryMaxReceiveCount:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 1000
    Description: >-
      Receives of a media-retry message before it moves to the media-retry dead-letter
      queue (which has an alarm). Receives are at least the retry queue's visibility
      timeout apart.
  RetentionDays:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Days a Tweet and its media are kept (DynamoDB TTL on expires_at plus S3 lifecycle
      expiration on media/ and text/). 0 keeps everything forever; deletions at the
      source are still propagated.
  ComplianceSchedule:
    Type: String
    Default: rate(1 day)
    Description: EventBridge schedule expression for the deletion-compliance run.
  ComplianceMaxLookups:
    Type: Number
    Default: 1000
    MinValue: 1
    Description: >-
      Most stored Tweet IDs one compliance run checks against the X API (100 per
      request). The run resumes where the last stopped and wraps around.
  DeletionGraceHours:
    Type: Number
    Default: 24
    MinValue: 0
    Description: >-
      Hours between tombstoning a Tweet that is unavailable at the source and removing
      its item and all its S3 objects (every version).
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARN, ERROR]
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic ARN notified by the alarms. Leave empty for none.

Conditions:
  HasRetention: !Not [!Equals [!Ref RetentionDays, "0"]]
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, ""]]
  # SAM treats any non-empty `Enabled` string as true, so map the parameter to State.
  ScheduleIsEnabled: !Equals [!Ref ScheduleEnabled, "true"]

Globals:
  Function:
    Runtime: python3.14
    Architectures: [arm64]
    Tracing: Active
    CodeUri: build/lambda/  # pre-built by scripts/build_lambda.sh; no `sam build` step
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: !Ref LogLevel
      SystemLogLevel: WARN

Resources:
  # --- Storage ---------------------------------------------------------------
  # Empty on creation. Fill it with scripts/put_secret.sh so the token never
  # appears in the template, parameters or environment variables.
  BearerTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: X API v2 bearer token. Value is set out of band by scripts/put_secret.sh.

  TweetsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain  # collected data outlives the stack
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: tweet_id, AttributeType: S}
        - {AttributeName: username, AttributeType: S}
        - {AttributeName: created_at, AttributeType: S}
        - {AttributeName: tombstone, AttributeType: S}
        - {AttributeName: deleted_at, AttributeType: S}
      KeySchema:
        - {AttributeName: tweet_id, KeyType: HASH}
      GlobalSecondaryIndexes:
        - IndexName: username-created_at-index
          KeySchema:
            - {AttributeName: username, KeyType: HASH}
            - {AttributeName: created_at, KeyType: RANGE}
          # Listings need only these; INCLUDE keeps GSI write units and storage well
          # below ALL. Fetch other attributes with GetItem on tweet_id. text may be a
          # prefix of an offloaded text; text_truncated and text_s3_key say so.
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              [text, text_truncated, text_s3_key, media_count, public_metrics]
        # Sparse: only tombstoned items carry `tombstone`, so the compliance job finds
        # what to purge with a Query that reads just those, never a table scan.
        - IndexName: tombstone-deleted_at-index
          KeySchema:
            - {AttributeName: tombstone, KeyType: HASH}
            - {AttributeName: deleted_at, KeyType: RANGE}
          Projection:
            ProjectionType: KEYS_ONLY
      # Items expire at their epoch `expires_at`. The attribute is only written when
      # RetentionDays > 0, so by default nothing ever expires.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # Per-user checkpoint: the newest Tweet ID already fetched.
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: username, AttributeType: S}
      KeySchema:
        - {AttributeName: username, KeyType: HASH}
      SSESpecification:
        SSEEnabled: true

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain  # collected media outlives the stack
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled  # a deleted or overwritten media object stays recoverable
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          # Per prefix, never bucket-wide: raw/ versions are never expired.
          - Id: expire-noncurrent-versions
            Status: Enabled
            Prefix: media/
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: expire-noncurrent-text-versions
            Status: Enabled
            Prefix: text/
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: tier-media
            Status: Enabled
            Prefix: media/
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 0
          # With RetentionDays > 0 objects expire as the items do (the delete marker's
          # noncurrent version is removed by expire-noncurrent-versions).
          - !If
            - HasRetention
            - Id: retention-media
              Status: Enabled
              Prefix: media/
              ExpirationInDays: !Ref RetentionDays
            - !Ref AWS::NoValue
          - !If
            - HasRetention
            - Id: retention-text
              Status: Enabled
              Prefix: text/
              ExpirationInDays: !Ref RetentionDays
            - !Ref AWS::NoValue
          # No rule for raw/ on purpose: those pages are the only copy of fields the
          # processor doesn't keep, so they are never expired or tiered (gzipped pages
          # are far below the 128 KB S3 minimum for lifecycle transitions anyway).

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub "${MediaBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # --- Queues ----------------------------------------------------------------
  TweetsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600  # 14 days
      # Matches SQS_MAX_MESSAGE_BYTES; the DLQ must take whatever the main queue does.
      MaximumMessageSize: 1048576
      SqsManagedSseEnabled: true
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          # Built from the name, not !GetAtt: TweetsQueue already depends on this queue.
          - !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-tweets"

  TweetsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-tweets"  # fixed so the DLQ can name it
      SqsManagedSseEnabled: true
      # 6 x ProcessFunction timeout (120 s) + its 10 s batching window, per AWS guidance
      # for SQS event sources.
      VisibilityTimeout: 730
      MaximumMessageSize: 1048576  # matches SQS_MAX_MESSAGE_BYTES
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TweetsDeadLetterQueue.Arn
        maxReceiveCount: !Ref MaxReceiveCount

  # Media that couldn't be stored by the last receive of its Tweet message: one message
  # per media item, consumed by MediaRetryFunction.
  MediaRetryDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600  # 14 days
      MaximumMessageSize: 1048576  # matches MediaRetryQueue
      SqsManagedSseEnabled: true
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          # Built from the name, not !GetAtt: MediaRetryQueue already depends on this queue.
          - !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-media-retry"

  MediaRetryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-media-retry"  # fixed so the DLQ can name it
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600  # 14 days
      # 6 x MediaRetryFunction timeout (900 s); BatchSize 1 has no batching window.
      VisibilityTimeout: 5400
      MaximumMessageSize: 1048576  # same as TweetsQueue
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MediaRetryDeadLetterQueue.Arn
        maxReceiveCount: !Ref MediaRetryMaxReceiveCount

  # --- Log groups ------------------------------------------------------------
  FetchFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  ProcessFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  MediaRetryFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  ComplianceFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  # --- Functions -------------------------------------------------------------
  FetchFunction:
    Type: AWS::Serverless::Function
    # Deploy the processor first: it understands note_text and offloads big texts to
    # S3, so it must be live before the fetcher can send long posts.
    DependsOn: ProcessFunction
    Properties:
      Description: Pulls a user's timeline from the X API and queues one message per Tweet.
      Handler: twitter_timeline_data_pipeline.handlers.fetch.handler
      Timeout: 300
      MemorySize: 256
      # No reserved concurrency: the checkpoint write is conditional, so overlapping runs
      # only cause duplicates, which processing tolerates.
      LoggingConfig:
        LogGroup: !Ref FetchFunctionLogGroup
      Environment:
        Variables:
          TWITTER_USERNAME: !Ref TwitterUsername
          BEARER_TOKEN_SECRET_ARN: !Ref BearerTokenSecret
          QUEUE_URL: !Ref TweetsQueue
          STATE_TABLE: !Ref StateTable
          MEDIA_BUCKET: !Ref MediaBucket
          MAX_PAGES: !Ref MaxPages
          MAX_RESULTS: !Ref MaxResults
          EXPAND_REFERENCED_TWEETS: !Ref ExpandReferencedTweets
          REQUEST_ENTITIES: !Ref RequestEntities
          USER_ID_TTL_HOURS: !Ref UserIdTtlHours
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt TweetsQueue.QueueName
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref BearerTokenSecret
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt StateTable.Arn
            # Raw API pages only: the fetcher can't touch media/ or text/ objects.
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${MediaBucket.Arn}/raw/*"
            # Unparseable Tweets and unsendable messages, kept for a fix and replay.
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${MediaBucket.Arn}/quarantine/*"
      EventInvokeConfig:
        # The next scheduled run retries; a retry would only burn API rate limit.
        MaximumRetryAttempts: 0
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            State: !If [ScheduleIsEnabled, ENABLED, DISABLED]

  ProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Stores Tweet metadata in DynamoDB and media in S3.
      Handler: twitter_timeline_data_pipeline.handlers.process.handler
      Timeout: 120
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref ProcessFunctionLogGroup
      Environment:
        Variables:
          TWEETS_TABLE: !Ref TweetsTable
          MEDIA_BUCKET: !Ref MediaBucket
          MAX_MEDIA_BYTES: !Ref MaxMediaBytes
          MAX_RECEIVE_COUNT: !Ref MaxReceiveCount
          MEDIA_RETRY_QUEUE_URL: !Ref MediaRetryQueue
          RETENTION_DAYS: !Ref RetentionDays
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref TweetsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MediaRetryQueue.QueueName
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:AbortMultipartUpload]
              Resource:
                - !Sub "${MediaBucket.Arn}/media/*"
                - !Sub "${MediaBucket.Arn}/text/*"
            # raw/ is read-only: a referenced long post left out of an oversized
            # message is read back from its raw page.
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${MediaBucket.Arn}/raw/*"
            # The S3 text of a referenced original that is now unavailable is deleted.
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub "${MediaBucket.Arn}/text/*"
            # ListBucket makes HeadObject return 404 instead of 403 for missing keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt MediaBucket.Arn
      Events:
        TweetsQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt TweetsQueue.Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 5

  MediaRetryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Stores media the process function gave up on and updates its Tweet item.
      Handler: twitter_timeline_data_pipeline.handlers.media_retry.handler
      Timeout: 900  # room for a large video (about 880 s of download)
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref MediaRetryFunctionLogGroup
      Environment:
        Variables:
          TWEETS_TABLE: !Ref TweetsTable
          MEDIA_BUCKET: !Ref MediaBucket
          MAX_MEDIA_BYTES: !Ref MaxMediaBytes
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt TweetsTable.Arn
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:AbortMultipartUpload]
              Resource: !Sub "${MediaBucket.Arn}/media/*"  # media only, not the text/ objects
            # ListBucket makes HeadObject return 404 instead of 403 for missing keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt MediaBucket.Arn
      Events:
        MediaRetryQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt MediaRetryQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 2  # bounds concurrent big downloads

  # The only function allowed to delete: no other function has any delete permission.
  ComplianceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: >-
        Tombstones Tweets deleted or made unavailable at the source, then removes their
        item and every S3 object version after the grace period.
      Handler: twitter_timeline_data_pipeline.handlers.compliance.handler
      Timeout: 300
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref ComplianceFunctionLogGroup
      Environment:
        Variables:
          TWITTER_USERNAME: !Ref TwitterUsername
          BEARER_TOKEN_SECRET_ARN: !Ref BearerTokenSecret
          TWEETS_TABLE: !Ref TweetsTable
          STATE_TABLE: !Ref StateTable
          MEDIA_BUCKET: !Ref MediaBucket
          COMPLIANCE_MAX_LOOKUPS: !Ref ComplianceMaxLookups
          DELETION_GRACE_HOURS: !Ref DeletionGraceHours
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref BearerTokenSecret
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${TweetsTable.Arn}/index/*"
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
              Resource: !GetAtt TweetsTable.Arn
            # Its own cursor items only (`compliance#<handle>`), not the fetch checkpoints.
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt StateTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["compliance#*"]
            - Effect: Allow
              Action: [s3:ListBucketVersions, s3:ListBucket]
              Resource: !GetAtt MediaBucket.Arn
              Condition:
                StringLike:
                  "s3:prefix": ["media/*", "text/*", "raw/*", "quarantine/*"]
            - Effect: Allow
              Action: [s3:DeleteObject, s3:DeleteObjectVersion]
              Resource:
                - !Sub "${MediaBucket.Arn}/media/*"
                - !Sub "${MediaBucket.Arn}/text/*"
                - !Sub "${MediaBucket.Arn}/raw/*"
                - !Sub "${MediaBucket.Arn}/quarantine/*"
            # Raw pages are rewritten without a deleted Tweet; quarantined objects are
            # only read (to find a Tweet) and deleted.
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub "${MediaBucket.Arn}/raw/*"
                - !Sub "${MediaBucket.Arn}/quarantine/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${MediaBucket.Arn}/raw/*"
      EventInvokeConfig:
        # The next scheduled run retries; the cursor and tombstones persist.
        MaximumRetryAttempts: 0
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: !Ref ComplianceSchedule
            State: !If [ScheduleIsEnabled, ENABLED, DISABLED]

  # --- Alarms ----------------------------------------------------------------
  DeadLetterQueueNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Messages are sitting in the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt TweetsDeadLetterQueue.QueueName}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  MediaRetryDeadLetterQueueNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        Media could not be stored even after the media-retry attempts; see the
        runbook to inspect and redrive the media-retry dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt MediaRetryDeadLetterQueue.QueueName}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  MediaRetryFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The media-retry function reported errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref MediaRetryFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  ComplianceFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        The compliance function failed: deletions at the source may not be propagated
        within the documented window.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref ComplianceFunction}
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  FetchFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The fetch function failed in the last hour.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref FetchFunction}
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  ProcessFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The process function reported errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref ProcessFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

Outputs:
  QueueUrl:
    Value: !Ref TweetsQueue
  DeadLetterQueueUrl:
    Value: !Ref TweetsDeadLetterQueue
  MediaRetryQueueUrl:
    Value: !Ref MediaRetryQueue
  MediaRetryDeadLetterQueueUrl:
    Value: !Ref MediaRetryDeadLetterQueue
  TweetsTableName:
    Value: !Ref TweetsTable
  StateTableName:
    Value: !Ref StateTable
  MediaBucketName:
    Value: !Ref MediaBucket
  BearerTokenSecretArn:
    Value: !Ref BearerTokenSecret
  FetchFunctionName:
    Value: !Ref FetchFunction
  ProcessFunctionName:
    Value: !Ref ProcessFunction
  MediaRetryFunctionName:
    Value: !Ref MediaRetryFunction
  ComplianceFunctionName:
    Value: !Ref ComplianceFunction
